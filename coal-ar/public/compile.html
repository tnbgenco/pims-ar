<!doctype html><html><head><meta charset="utf-8"><title>Build AR target</title></head><body><pre id="status">Loading compiler…</pre><script type="module">
import {Compiler} from 'https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image.prod.js';
try {const img=new Image();img.src='./flyer-target.png';await img.decode();const compiler=new Compiler();await compiler.compileImageTargets([img],p=>document.querySelector('#status').textContent='Compiling '+Math.round(p)+'%');const bytes=await compiler.exportData();window.targetBytes=Array.from(new Uint8Array(bytes));document.querySelector('#status').textContent='DONE';}catch(e){document.querySelector('#status').textContent='ERROR '+e;console.error(e);}
</script></body></html>
